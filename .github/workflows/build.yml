name: NxNative - Wonder IPA Builder

# Reworked from the community "universal" workflow. Fixes: (1) Xcode 27.2 + its Metal toolchain, which
# the pinned nxnative lock requires (macos-latest has Xcode 26.6); (2) zbic installed (the build script
# refuses to start without it); (3) the nonexistent `dmsh_chain.py --update-lock` step removed;
# (4) Google Drive file IDs masked in logs; (5) toolchain checks run BEFORE the multi-GB download;
# (6) nxnative pinned to a reviewed commit; (7) optional passphrase-encrypted IPA output.

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: "Optional nxnative profile ID override (leave blank for automatic detection)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  NXNATIVE_REF: edc07d34bd21a2683e6e5897651a5664a15abcc7
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout nxnative (pinned)
        uses: actions/checkout@v4
        with:
          repository: seedds/nxnative
          ref: ${{ env.NXNATIVE_REF }}
          persist-credentials: false

      - name: Select Xcode 27.2 and show disk
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || { echo "::error::Xcode 27.2 not found on this runner image"; ls /Applications | grep -i xcode || true; exit 1; }
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          df -h / "$RUNNER_TEMP" || true
          AVAIL_GB="$(df -g / | awk 'NR==2{print $4}')"
          echo "Free space: ${AVAIL_GB} GB"
          if [ "${AVAIL_GB:-0}" -lt 45 ]; then
            echo "Low disk; removing unused Xcode versions"
            sudo rm -rf /Applications/Xcode_27.0.app /Applications/Xcode_27.1.app || true
            df -h / || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd gdown
          python -c "import lz4.block, capstone, fontTools, zbic, gdown; print('python modules OK, capstone', capstone.__version__)"

      - name: Install Metal toolchain and verify the toolchain matches nxnative's lock
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos --show-sdk-version
          xcrun -sdk iphoneos metal --version
          xcrun -sdk macosx metal --version
          python3 dm/gfx/tools/own_compilers.py --check-metal
          echo "Toolchain matches the lock."

          # Mirror build_ipa_from_nsp.py's check_prereqs now, so a gap fails in a minute, not after the download.
          for t in xcodebuild xcodegen zstd make glslangValidator; do
            command -v "$t" >/dev/null || { echo "::error::prerequisite missing: $t"; exit 1; }
          done
          dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate --source-sha
          rc=0; dm/gfx/tools/spirv_cross_bin/spirv-cross --help >/dev/null 2>&1 || rc=$?
          [ "$rc" -lt 126 ] || { echo "::error::spirv-cross cannot execute (exit $rc)"; exit 1; }
          python -c "import compression.zstd" 2>/dev/null || python -c "import backports.zstd"
          python -c "import capstone; assert capstone.cs_version()[0]==5"
          echo "Prerequisites OK."

      - name: Download game files and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          DLC_URL: ${{ secrets.DLC_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "${url:-}" ]]; then
              echo "::error::A required download URL is empty."
              exit 1
            fi

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in ("drive.google.com", "www.drive.google.com"):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(r"[-A-Za-z0-9_]{20,}", url):
              file_id = url

          if not file_id:
              raise SystemExit("Could not extract a Google Drive file ID.")

          print(file_id)
          PY
          )"

            # Mask the ID so it never appears in (possibly public) logs.
            echo "::add-mask::$file_id"

            echo "Downloading $(basename "$output")..."
            gdown --quiet "$file_id" -O "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty."
              exit 1
            fi

            echo "Downloaded $(basename "$output"): $(stat -f%z "$output") bytes"
            file "$output"
          }

          download_file "$KEYS_URL" "$WORK/prod.keys"
          # a Drive error page instead of the keys would be small HTML
          if head -c 200 "$WORK/prod.keys" | grep -qi '<html'; then
            echo "::error::Keys download is an HTML page, not a keys file (check sharing is 'Anyone with the link')."
            exit 1
          fi
          grep -q '^master_key_00' "$WORK/prod.keys" || { echo "::error::prod.keys has no master_key_00 line."; exit 1; }

          download_file "$GAME_URL" "$WORK/game.download"

          if [[ -n "${UPDATE_URL:-}" ]]; then
            download_file "$UPDATE_URL" "$WORK/update.download"
          else
            echo "No UPDATE_URL configured; continuing without an update."
          fi

          if [[ -n "${DLC_URL:-}" ]]; then
            download_file "$DLC_URL" "$WORK/dlc.download"
          else
            echo "No DLC_URL configured; continuing without DLC."
          fi

          chmod 600 "$WORK/prod.keys"
          df -h / || true

      - name: Stage game packages
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          mkdir -p "$GAME_DIR"

          # Direct NSP/XCI downloads are moved (not copied) to save disk space.
          python - "$WORK" "$GAME_DIR" <<'PY'
          import shutil
          import sys
          from pathlib import Path

          work = Path(sys.argv[1])
          game_dir = Path(sys.argv[2])

          for label in ("game", "update", "dlc"):
              source = work / f"{label}.download"
              if not source.exists():
                  print(f"No {label} download; skipping.")
                  continue
              with source.open("rb") as f:
                  magic = f.read(4)
              if magic == b"PFS0":
                  ext = ".nsp"
              elif magic == b"HEAD":
                  ext = ".xci"
              else:
                  raise SystemExit(
                      f"{label} download is not a direct NSP/XCI package "
                      f"(first bytes {magic!r}). If it is an archive or a Drive "
                      "error page, upload the raw .nsp file instead."
                  )
              target = game_dir / f"{label}{ext}"
              shutil.move(str(source), str(target))
              print(f"Staged {label}: {target.name} ({target.stat().st_size:,} bytes)")
          PY

          ls -l "$GAME_DIR"
          test -s "$WORK/prod.keys"

      - name: Detect game title ID
        env:
          PROFILE_OVERRIDE: ${{ inputs.profile_id }}
        shell: bash
        run: |
          set -euo pipefail
          GAME_DIR="$RUNNER_TEMP/GameFiles"

          DETECTED_ID="$(python - "$GAME_DIR" <<'PY'
          import re
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidates = set()

          for path in root.iterdir():
              if path.suffix.lower() not in (".nsp", ".xci", ".nsz", ".xcz") or not path.is_file():
                  continue
              with path.open("rb") as f:
                  header = f.read(16)
                  if len(header) != 16 or header[:4] != b"PFS0":
                      continue
                  count, string_size = struct.unpack_from("<II", header, 4)
                  if count > 100000 or string_size > 100000000:
                      continue
                  entries = f.read(count * 0x18)
                  strings = f.read(string_size)
              for i in range(count):
                  offset = struct.unpack_from("<I", entries, i * 0x18 + 0x10)[0]
                  end = strings.find(b"\0", offset)
                  if end < 0:
                      continue
                  name = strings[offset:end].decode(errors="replace")
                  m = re.fullmatch(r"([0-9A-Fa-f]{16})[0-9A-Fa-f]{16}\.tik", name)
                  if m:
                      tid = int(m.group(1), 16)
                      if (tid & 0xFFF) == 0:
                          candidates.add(f"{tid:016X}")

          if len(candidates) != 1:
              raise SystemExit(
                  "Could not uniquely identify the base game's title ID. "
                  f"Candidates found: {sorted(candidates)}."
              )
          print(next(iter(candidates)))
          PY
          )"

          PROFILE_ID="${PROFILE_OVERRIDE:-$DETECTED_ID}"
          PROFILE_ID="$(echo "$PROFILE_ID" | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$PROFILE_ID" =~ ^[0-9A-F]{16}$ ]]; then
            echo "::error::Profile ID must be exactly 16 hexadecimal characters."
            exit 1
          fi
          test -d "dm/games/$PROFILE_ID" || { echo "::error::nxnative has no profile for $PROFILE_ID"; exit 1; }

          echo "Detected base title ID: $DETECTED_ID"
          echo "Profile ID: $PROFILE_ID"
          echo "DM_GAME=$PROFILE_ID" >> "$GITHUB_ENV"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/nxnative"
          GAME_DIR="$RUNNER_TEMP/GameFiles"
          OUTPUT="$RUNNER_TEMP/NxNative.ipa"

          python scripts/build_ipa_from_nsp.py \
            "$GAME_DIR" \
            -k "$WORK/prod.keys" \
            -o "$OUTPUT"

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::IPA build did not produce an output file."
            exit 1
          fi

          echo "IPA successfully created: $OUTPUT"
          ls -lh "$OUTPUT"

      - name: Encrypt IPA (only if IPA_PASSPHRASE secret is set)
        env:
          IPA_PASSPHRASE: ${{ secrets.IPA_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/NxNative.ipa"
          if [[ -n "${IPA_PASSPHRASE:-}" ]]; then
            /usr/bin/openssl enc -aes-256-cbc -pbkdf2 -salt -in "$IPA" -out "$IPA.enc" -pass env:IPA_PASSPHRASE
            rm -f "$IPA"
            ls -lh "$IPA.enc"
            echo "UPLOAD_PATH=$IPA.enc" >> "$GITHUB_ENV"
            echo "UPLOAD_NAME=NxNative-IPA-encrypted" >> "$GITHUB_ENV"
          else
            echo "UPLOAD_PATH=$IPA" >> "$GITHUB_ENV"
            echo "UPLOAD_NAME=NxNative-IPA" >> "$GITHUB_ENV"
          fi

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOAD_NAME }}
          path: ${{ env.UPLOAD_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-Build-Logs
          path: |
            ${{ runner.temp }}/GameFiles/*_build/logs/
          if-no-files-found: ignore
          retention-days: 3

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/nxnative" "$RUNNER_TEMP/GameFiles" "$RUNNER_TEMP/NxNative.ipa" "$RUNNER_TEMP/NxNative.ipa.enc"
